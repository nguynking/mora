# Temporary: fetch public-domain paintings for review. Removed after the art is chosen.
name: Fetch art
on:
  push:
    branches: [claude/mora-refine-deploy-wt0rtu]
    paths: ['scripts/fetch-art.py', '.github/workflows/fetch-art.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fetch-art.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-staging
          git commit -m "Stage public-domain paintings for review [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
